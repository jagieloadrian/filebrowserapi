syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package com.anjo.filebrowser;

service FilebrowserApi {
  rpc showFilesTree(PathRequest)returns (StringsResponse);
  rpc uploadFile(stream UploadFile)returns (StringResponse);
  rpc getFile(FileOperation)returns (stream FileResponse);
  rpc renameFile(FileOperation)returns (StringResponse);
  rpc deleteFile(FileOperation)returns (google.protobuf.Empty);
  rpc showDirectoriesTree(PathRequest)returns (StringsResponse);
  rpc addDirectory(FileOperation)returns (StringResponse);
  rpc addDirectoriesRecursively(PathRequest)returns (StringResponse);
  rpc renameDirectory(FileOperation)returns (StringResponse);
  rpc deleteDirectory(PathRequest)returns (google.protobuf.Empty);
  rpc deleteDirectoryRecursively(PathRequest)returns (google.protobuf.Empty);
  rpc listEntries(EntriesRequest)returns (EntriesResponse);
  rpc updateEntryMeta(EntryMetaUpdate)returns (Entry);
  rpc findDuplicates(PathRequest)returns (DuplicatesResponse);
  rpc copyEntry(EntryTransfer)returns (StringResponse);
  rpc moveEntry(EntryTransfer)returns (StringResponse);
}

message PathRequest {
  string path = 1;
}

message StringsResponse {
  repeated string directories = 1;
}

message StringResponse {
  string path = 1;
}

message FileOperation {
  string name = 1;
  string path = 2;
}

message UploadFile {
  bytes data = 1;
  string name = 2;
  reserved 3;
  reserved "contentType";
  optional string path = 4;
  bool overwrite = 5;
}

message FileResponse {
  bytes data = 1;
}

message EntriesRequest {
  string path = 1;
  string name = 2;
  string extension = 3;
  string tag = 4;
}

message Entry {
  string path = 1;
  bool directory = 2;
  int64 size = 3;
  google.protobuf.Timestamp modified = 4;
  string content_type = 5;
  string description = 6;
  repeated string tags = 7;
}

message EntriesResponse {
  repeated Entry entries = 1;
}

message EntryTransfer {
  string source = 1;
  string target = 2;
}

message EntryMetaUpdate {
  string path = 1;
  string description = 2;
  repeated string tags = 3;
}

message DuplicateGroup {
  string sha256 = 1;
  int64 size = 2;
  repeated string paths = 3;
}

message DuplicatesResponse {
  repeated DuplicateGroup groups = 1;
}
