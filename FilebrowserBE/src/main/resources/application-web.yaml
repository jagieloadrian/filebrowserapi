spring:
  application:
    name: filebrowser-be
  main:
    web-application-type: servlet
  lifecycle:
    timeout-per-shutdown-phase: 20s
  grpc:
    server:
      enabled: false
  servlet:
    multipart:
      max-file-size: ${application.max-upload-size}
      max-request-size: ${application.max-upload-size}

server:
  port: 8080

logging:
  level:
    root: info

springdoc:
  api-docs:
    enabled: true
  show-actuator: true

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState, db
