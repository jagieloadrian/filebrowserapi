name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check build --console=plain

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: image-${{ github.ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "value=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - run: ./gradlew :FilebrowserBE:jib -PimageTag=${{ steps.tag.outputs.value }} --console=plain
      - name: Deploy (bump image tag)
        if: steps.app-token.outputs.token != ''
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          sed -i -E "s#(image: ghcr.io/jagieloadrian/filebrowserapi):[^[:space:]]+#\1:$TAG#" .devops/helm/release.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(deploy): $TAG [skip ci]" .devops/helm/release.yaml
          git pull --rebase && git push
