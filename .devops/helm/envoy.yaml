apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser-grpc-web-envoy
  labels:
    app.kubernetes.io/name: filebrowser
    app.kubernetes.io/part-of: homelab
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: grpc_web
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: grpc_web
                    route_config:
                      virtual_hosts:
                        - name: filebrowser
                          domains: ["*"]
                          routes:
                            - match: { prefix: /com.anjo.filebrowser.FilebrowserApi/ }
                              route: { cluster: filebrowser_grpc, timeout: 0s }
                    http_filters:
                      - name: envoy.filters.http.grpc_web
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: health
          address:
            socket_address: { address: 0.0.0.0, port_value: 9901 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: health
                    route_config: {}
                    http_filters:
                      - name: envoy.filters.http.health_check
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
                          pass_through_mode: false
                          headers:
                            - name: ":path"
                              string_match: { exact: /ready }
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: filebrowser_grpc
          type: STRICT_DNS
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: filebrowser_grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: filebrowser-grpc.apps.svc.cluster.local, port_value: 9090 }
