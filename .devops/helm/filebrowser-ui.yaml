apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: filebrowser-ui
spec:
  interval: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./charts/app
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    image: ghcr.io/jagieloadrian/filebrowserapi-ui:main-20261116075219-fd3a023
    port: 8080
    tmpSize: 64Mi
    nodeSelector:
      homelab/node: rpi
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi
    route:
      hostname: filebrowser.home.arpa
      pathPrefix: /
    env:
      BACKEND_URL: http://filebrowser-api.apps.svc.cluster.local:8080
